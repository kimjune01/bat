# Rendered by /immunize on 2026-05-14 (v0.3 shape)
#
# One workflow, two jobs:
#   filter (cheap, ~seconds, no LLM) → label immune:reject if it rejects
#   attend (LLM, ~$0.05/PR via gemini) → wait for CI green, then synthesize
#
# Labels are TERMINAL-ONLY: immune:reject / immune:trusted / immune:suspect.
# Run-state is conveyed by GHA-native check_runs, not labels.
#
# OPTIONAL: to save your CI runner-minutes on filter-rejected spam, add this
# one line to YOUR existing CI workflow's job(s):
#   if: "!contains(github.event.pull_request.labels.*.name, 'immune:reject')"

name: immune
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - id: run
        uses: kimjune01/immune/filter@v0.3.2
        with:
          mode: advisory

  attend:
    needs: filter
    if: needs.filter.outputs.verdict == 'pass'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for maintainer CI (transparent ~20-line poll, no external action deps)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          # Poll WORKFLOW_RUNS (not check_runs) for the PR's HEAD SHA. We
          # filter by workflow NAME — our own workflow (filter+attend jobs)
          # is one workflow_run; the maintainer's CI is another. Querying
          # check_runs and filtering by name was wrong: check_runs are named
          # by JOB ("filter", "attend"), so the workflow-name comparison
          # never matched and we waited on our own attend job forever.
          while true; do
            runs=$(gh api --paginate "repos/${REPO}/actions/runs?head_sha=${PR_SHA}&event=pull_request_target")
            others=$(echo "$runs" | jq --arg w "$THIS_WORKFLOW" '
              [.workflow_runs[] | select(.name != $w)]')
            pending=$(echo "$others" | jq '[.[] | select(.status != "completed")] | length')
            failures=$(echo "$others" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')
            if [ "$failures" -gt 0 ]; then
              echo "::notice::Maintainer CI failed/cancelled — attend exits silently (no label change; the red X on CI is enough signal)"
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All maintainer CI workflow runs completed successfully — proceeding to attend"
              break
            fi
            echo "Waiting on $pending pending workflow run(s)..."
            sleep 20
          done

      - uses: kimjune01/immune/attend@v0.3.2
        with:
          agent: gemini
          hg-fanout: '3'
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
