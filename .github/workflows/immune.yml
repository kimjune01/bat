# Rendered by /immunize on 2026-05-14 (v0.3 shape)
#
# One workflow, two jobs:
#   filter (cheap, ~seconds, no LLM) → label immune:reject if it rejects
#   attend (LLM, ~$0.05/PR via gemini) → wait for CI green, then synthesize
#
# Labels are TERMINAL-ONLY: immune:reject / immune:trusted / immune:suspect.
# Run-state is conveyed by GHA-native check_runs, not labels.
#
# OPTIONAL: to save your CI runner-minutes on filter-rejected spam, add this
# one line to YOUR existing CI workflow's job(s):
#   if: "!contains(github.event.pull_request.labels.*.name, 'immune:reject')"

name: immune
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - id: run
        uses: kimjune01/immune/filter@v0.3
        with:
          mode: advisory

  attend:
    needs: filter
    if: needs.filter.outputs.verdict == 'pass'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for maintainer CI (transparent ~20-line poll, no external action deps)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          while true; do
            checks=$(gh api --paginate "repos/${REPO}/commits/${PR_SHA}/check-runs")
            pending=$(echo "$checks" | jq --arg w "$THIS_WORKFLOW" '
              [.check_runs[]
                 | select(.name != $w)
                 | select(.name | startswith($w + " /") | not)
                 | select(.status != "completed")
              ] | length')
            failures=$(echo "$checks" | jq --arg w "$THIS_WORKFLOW" '
              [.check_runs[]
                 | select(.name != $w)
                 | select(.name | startswith($w + " /") | not)
                 | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              ] | length')
            if [ "$failures" -gt 0 ]; then
              echo "::notice::Maintainer CI failed/cancelled — attend exits silently"
              exit 0
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All maintainer CI checks completed successfully — proceeding to attend"
              break
            fi
            echo "Waiting on $pending pending check(s)..."
            sleep 20
          done

      - uses: kimjune01/immune/attend@v0.3
        with:
          agent: gemini
          hg-fanout: '3'
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
